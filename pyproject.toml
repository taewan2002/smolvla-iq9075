[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smolvla-iq9075"
version = "0.1.0"
description = "Export and benchmark SmolVLA on Qualcomm IQ-9075"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "tokenizers>=0.21,<0.23"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
export = ["onnx==1.19.1", "safetensors>=0.4.5", "huggingface-hub>=0.34,<0.36"]
cpu = ["onnxruntime>=1.23,<2"]

[tool.setuptools.packages.find]
include = ["smolvla_iq9075*"]
